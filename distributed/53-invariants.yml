      - "rollback < 60 s"
      - "migrations are expand/contract, backward compatible"
      - "smoke suite gates the cutover"
    tooling: "two environments, k6, migration linter"

  - id: 53
    name: Canary Releases
    layer: delivery
    priority: P0
    invariant: "Canary sees a small, stable share of traffic; SLO breach triggers automatic rollback; users are not randomly flipped back and forth."
    break_it: "Inject 10% errors in the canary; flip a user between versions."
    assert:
      - "traffic split within +/-2% of target"
      - "rollback < 5 min after breach"
      - "assignment sticky per user/session"
      - "error budget burn recorded"
    tooling: "Argo Rollouts/Flagger, Prometheus, k6"
